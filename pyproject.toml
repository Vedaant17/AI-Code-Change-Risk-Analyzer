[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-risk-analyzer"
version = "0.1.0"
description = "AI Code Change-Risk Analyzer — MVP"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1,<4",
    "pydantic>=2.5,<3",
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "httpx>=0.26,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.2,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
